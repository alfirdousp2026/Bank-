<style>
:root{--p:#2F6F6A;--pt:#2F6F6A;--in:#1B8A4B;--out:#D64545;--warn:#E08A00;--bg:#F4F6F6;--card:#fff;--tx:#1f2933;--mut:#6b7780;--line:#e3e8e8;--bd:#cfd8d8;--inbg:#e6f4ec;--outbg:#fbeaea;--nbg:#e8f0f0;--sh:rgba(0,0,0,.05)}
html[data-theme=dark]{color-scheme:dark;--pt:#7ccbc3;--in:#3fbf7a;--out:#ef7070;--warn:#f0a030;--bg:#0f1516;--card:#182122;--tx:#e6eded;--mut:#93a3a5;--line:#263234;--bd:#37464a;--inbg:#163526;--outbg:#3b1e20;--nbg:#1d3130;--sh:rgba(0,0,0,.35)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,'Segoe UI',Tahoma,Arial,sans-serif;font-size:16px}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;width:100%;padding:12px;border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx)}
input[type=checkbox]{width:20px;height:20px;padding:0;accent-color:var(--p);flex:none}
label{display:block;margin:14px 0 6px;font-size:14px;color:var(--mut)}
label.chk{display:flex;align-items:center;gap:10px;color:var(--tx);font-size:15px}
.hdr{position:sticky;top:0;z-index:5;background:var(--p);color:#fff;display:flex;align-items:center;gap:8px;padding:12px 14px;padding-top:calc(12px + env(safe-area-inset-top))}
.hdr h1{margin:0;font-size:19px;flex:1}
.hdr button{background:none;border:0;color:#fff;font-size:22px;padding:4px 8px}
main{padding:12px 12px 150px;max-width:720px;margin:auto}
.card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:10px;box-shadow:0 1px 2px var(--sh)}
.big{font-size:32px;font-weight:700}
.in{color:var(--in)}.out{color:var(--out)}.warn{color:var(--warn)}.mut{color:var(--mut)}
.row{display:flex;align-items:center;gap:10px}

.sm{font-size:13px}
h3{margin:18px 4px 8px;font-size:16px}
.tile{display:flex;align-items:center;gap:10px;background:var(--card);padding:10px 12px;border-bottom:1px solid var(--line)}
.tile:first-child{border-radius:14px 14px 0 0}.tile:last-child{border-radius:0 0 14px 14px;border-bottom:0}
.tile:only-child{border-radius:14px}
.ava{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:18px;flex:none}
.ava.in{background:var(--inbg)}.ava.out{background:var(--outbg)}.ava.n{background:var(--nbg);color:var(--pt)}
.amt-t{font-weight:700;white-space:nowrap}
.tick{width:36px;height:36px;border-radius:50%;border:2px solid var(--bd);background:var(--card);font-size:18px;flex:none;color:#fff;display:grid;place-items:center;padding:0}
.delbtn{width:30px;height:30px;border-radius:50%;border:1px solid var(--out);background:var(--card);color:var(--out);font-size:14px;flex:none}
.tick.on{background:var(--in);border-color:var(--in)}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav button{flex:1;border:0;background:none;padding:8px 2px;font-size:11px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px}

nav button.on{color:var(--pt);font-weight:700}
.fab{position:fixed;left:16px;bottom:calc(72px + env(safe-area-inset-bottom));z-index:6;background:var(--p);color:#fff;border:0;border-radius:28px;padding:14px 20px;font-weight:700;box-shadow:0 4px 12px rgba(0,0,0,.25)}
.bar{display:flex;gap:8px;margin-bottom:8px}
.ib{position:relative;width:48px;flex:none;border:1px solid var(--bd);border-radius:12px;background:var(--card);font-size:20px}
.ib.on{background:var(--p);color:#fff;border-color:var(--p)}
.ib i{position:absolute;top:-6px;right:-6px;background:var(--out);color:#fff;font-size:11px;font-style:normal;border-radius:10px;padding:1px 6px}
.chips{display:flex;gap:8px;margin-bottom:10px;overflow-x:auto}
.chip{border:1px solid var(--bd);background:var(--card);border-radius:20px;padding:6px 14px;white-space:nowrap}
.chip.on{background:var(--p);color:#fff;border-color:var(--p)}
.sumline{display:flex;justify-content:space-between;font-size:14px;padding:4px 6px 8px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end}
.sh{background:var(--card);width:100%;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:16px;padding-bottom:calc(20px + env(safe-area-inset-bottom));max-width:720px;margin:auto}
.sh-h{display:flex;justify-content:space-between;align-items:center;font-size:18px;margin-bottom:6px}
.x{background:none;border:0;font-size:22px;color:var(--mut)}
.seg{display:flex;gap:8px}

.pick{width:100%;text-align:start;padding:12px;border:1px solid var(--bd);border-radius:12px;background:var(--card)}
.btn{width:100%;margin-top:16px;padding:14px;border:0;border-radius:14px;background:var(--p);color:#fff;font-size:18px;font-weight:700}
.btn.in{background:var(--in)}.btn.out{background:var(--out)}
.btn.ghost{background:var(--card);color:var(--pt);border:1px solid var(--p);font-size:16px;margin-top:8px}
.btn.danger{background:var(--card);color:var(--out);border:1px solid var(--out);font-size:16px}
.btn.dsolid{background:var(--out);color:#fff}
.btn.sm2{font-size:15px;padding:10px}
.kv{display:flex;gap:10px;padding:5px 0}.kv b{flex:1;font-weight:400;color:var(--mut)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}

#toast{position:fixed;bottom:110px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 18px;border-radius:20px;z-index:60;display:none;font-size:14px;align-items:center;max-width:92vw;white-space:nowrap}

#upd span{flex:1}

table.st{width:100%;border-collapse:collapse;font-size:13px}

.banner{display:flex;align-items:center;gap:10px;background:#fff3d6;color:#5b4300;border-radius:14px;padding:10px 12px;margin-bottom:10px;font-size:14px}

.ocard{padding:0;overflow:hidden}
.ohd{display:flex;align-items:center;gap:10px;padding:12px 14px}
.arow{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--line);font-size:15px}
.pill{background:var(--warn);color:#fff;border-radius:10px;font-size:11px;padding:1px 7px;font-weight:700}
.ghd{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.selbar{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom));z-index:7;background:var(--card);border-top:1px solid var(--line);display:flex;gap:6px;padding:8px 10px;align-items:center;box-shadow:0 -2px 8px var(--sh)}
.selbar b{flex:1;font-size:14px}
.selbar button{border:1px solid var(--bd);background:var(--card);border-radius:10px;padding:8px 10px;font-size:14px}
.selbar button.pri{background:var(--p);color:#fff;border-color:var(--p)}
.chart{display:flex;gap:6px;align-items:flex-end;height:150px;padding:4px 2px 0}
.chart .col{flex:1;min-width:0;text-align:center}
.chart .bars{height:120px;display:flex;align-items:flex-end;justify-content:center;gap:2px}
.chart .b{display:block;width:38%;max-width:14px;border-radius:4px 4px 0 0;min-height:2px}
.chart .b.in{background:var(--in)}.chart .b.out{background:var(--out)}
.chart small{display:block;font-size:10px;color:var(--mut);margin-top:3px}
.legend{display:flex;gap:14px;font-size:13px;margin:6px 4px 0;color:var(--mut)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:5px}
.thumb{max-width:100%;max-height:220px;border-radius:12px;border:1px solid var(--line);display:block;margin:8px auto;cursor:pointer}
.chk-tile{display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px solid var(--line);font-size:14px}
.dupbox{background:#fff3d6;color:#5b4300;border-radius:12px;padding:12px;margin:10px 0;font-size:14px;line-height:1.7}
html[data-theme=dark] .dupbox{background:#3a2e10;color:#f3d894}
#printArea{display:none}
@media print{
  body>*:not(#printArea){display:none!important}
  #printArea{display:block;padding:10mm;font-size:12px;color:#000;background:#fff}
  #printArea table{width:100%;border-collapse:collapse;margin-bottom:14px}
  #printArea th,#printArea td{border:1px solid #999;padding:4px 6px;text-align:start}
  #printArea th{background:#eee}
  #printArea h2{page-break-before:auto;margin:14px 0 4px}
}
</style>

<script>
'use strict';
/* ================= أدوات ================= */
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = (n) => Number(n).toLocaleString('en-US', { maximumFractionDigits: 2 });
const pad2 = (n) => String(n).padStart(2, '0');
const isoOf = (d) => d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
const today = () => isoOf(new Date());
const fmtDate = (iso) => new Date(iso + 'T00:00:00').toLocaleDateString('ar-EG-u-nu-latn', { day: 'numeric', month: 'short', year: 'numeric' });
const shortDate = (iso) => (iso ? iso.slice(8, 10) + '/' + iso.slice(5, 7) + '/' + iso.slice(2, 4) : '');
const dayNum = (iso) => Math.round(Date.UTC(+iso.slice(0, 4), +iso.slice(5, 7) - 1, +iso.slice(8, 10)) / 864e5);
const r2 = (x) => Math.round(x * 100) / 100;
const digits = (s) => String(s ?? '').replace(/[٠-٩]/g, (d) => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g, (d) => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d));
function num(s) {
  const t = digits(s).replace(/[٫]/g, '.').replace(/[٬,\s]/g, '');
  const v = parseFloat(t);
  return isFinite(v) ? v : NaN;
}
function numLoose(x) {
  if (typeof x === 'number') return isFinite(x) ? x : NaN;
  let s = digits(x).replace(/٫/g, '.').replace(/٬/g, '').trim();
  if (!s) return NaN;
  const neg = /^\(.*\)$/.test(s) || /^[^\d]*-\s*\d/.test(s) || /\d\s*-$/.test(s);
  s = s.replace(/[^\d.,]/g, '').replace(/,/g, '');
  const v = parseFloat(s);
  if (!isFinite(v)) return NaN;
  return neg ? -Math.abs(v) : v;
}
const b64 = (u8) => { let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); };
const unb64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
function blobToDataUrl(b) { return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(b); }); }
function dataUrlToBlob(u) { const i = u.indexOf(','); const mime = /^data:([^;,]+)/.exec(u)[1]; return new Blob([unb64(u.slice(i + 1))], { type: mime }); }

let toastT, toastFn = null;
function toast(m, actLabel, actFn) {
  const t = $('#toast'); t.textContent = '';
  const sp = document.createElement('span'); sp.textContent = m; t.appendChild(sp);
  toastFn = null;
  if (actLabel) { const b = document.createElement('button'); b.textContent = actLabel; b.dataset.act = 'toastAct'; t.appendChild(b); toastFn = actFn; }
  t.style.display = 'flex'; clearTimeout(toastT);
  toastT = setTimeout(() => { t.style.display = 'none'; toastFn = null; }, actLabel ? 7000 : 2200);
}
function download(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

/* ============ المظهر ============ */
const THEME_KEY = 'recon_theme';
function applyTheme() {
  const m = localStorage.getItem(THEME_KEY) || 'auto';
  const dark = m === 'dark' || (m === 'auto' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  const mt = document.querySelector('meta[name=theme-color]'); if (mt) mt.content = dark ? '#1d4a46' : '#2F6F6A';
}

/* ============ بحث عربي يتحمل الأخطاء ============ */
function norm(s) {
  return String(s || '').toLowerCase().trim().replace(/[\u064B-\u0652\u0640]/g, '')
    .replace(/[أإآ]/g, 'ا').replace(/ى/g, 'ي').replace(/ة/g, 'ه').replace(/ؤ/g, 'و').replace(/ئ/g, 'ي').replace(/\s+/g, ' ');
}
function lev(a, b) {
  if (a === b) return 0; if (!a.length) return b.length; if (!b.length) return a.length;
  let prev = Array.from({ length: b.length + 1 }, (_, i) => i);
  for (let i = 1; i <= a.length; i++) {
    const cur = [i];
    for (let j = 1; j <= b.length; j++) cur[j] = Math.min(cur[j - 1] + 1, prev[j] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    prev = cur;
  }
  return prev[b.length];
}
function score(q, target) {
  q = norm(q); const t = norm(target);
  if (!q) return 1;
  const idx = t.indexOf(q);
  if (idx >= 0) return 100 - Math.min(idx, 50);
  const words = t.split(' '); let s = 0;
  for (const qw of q.split(' ')) {
    if (!qw) continue;
    const tol = qw.length <= 3 ? 0 : qw.length <= 6 ? 1 : 2;
    let best = 999;
    for (const w of words) best = Math.min(best, lev(qw, w.length > qw.length ? w.slice(0, qw.length) : w));
    if (best <= tol) s += 30 - best * 8; else return 0;
  }
  return s;
}

/* ================= التخزين (IndexedDB مع بديل localStorage) ================= */
const KEY = 'recon_web_v1';
const IDBS = { db: null };
function idbOpen() {
  return new Promise((res) => {
    try {
      if (!window.indexedDB) return res(false);
      const r = indexedDB.open('recon_web', 1);
      r.onupgradeneeded = () => { const d = r.result; d.createObjectStore('kv'); d.createObjectStore('files'); };
      r.onsuccess = () => { IDBS.db = r.result; res(true); };
      r.onerror = () => res(false); r.onblocked = () => res(false);
    } catch (e) { res(false); }
  });
}
function idbReq(store, mode, fn) {
  return new Promise((res, rej) => {
    const tx = IDBS.db.transaction(store, mode); const st = tx.objectStore(store); const r = fn(st);
    tx.oncomplete = () => res(r && r.result); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error);
  });
}
const idbGet = (s, k) => idbReq(s, 'readonly', (st) => st.get(k));
const idbPut = (s, k, v) => idbReq(s, 'readwrite', (st) => st.put(v, k));
const idbDel = (s, k) => idbReq(s, 'readwrite', (st) => st.delete(k));
const idbClear = (s) => idbReq(s, 'readwrite', (st) => st.clear());
const idbKeys = (s) => idbReq(s, 'readonly', (st) => st.getAllKeys());
async function fileLocalGet(id) { if (!IDBS.db) return null; try { return (await idbGet('files', id)) || null; } catch (e) { return null; } }
async function fileSave(id, blob) { if (!IDBS.db) return false; try { await idbPut('files', id, blob); if (SYNC.on) syncQueueFile(id); return true; } catch (e) { return false; } }
async function fileGet(id) { const b = await fileLocalGet(id); if (b || !SYNC.on) return b; return syncFetchFile(id); }
async function fileDel(id) { if (IDBS.db) { try { await idbDel('files', id); } catch (e) {} } if (SYNC.on) syncQueueFileDel(id); }

let db = null, saveQ = Promise.resolve();
const SYNC = { on: false, busy: false, err: '', last: 0, cfg: null, dev: '', lastKey: '', shadow: {}, tomb: {}, files: [], filesDel: [], stamp: {}, delStamp: {}, tok: null, tokExp: 0, timer: null, form: { dbUrl: '', apiKey: '', email: '', password: '' } };
function saveLocal() {
  if (IDBS.db) {
    const snap = JSON.parse(JSON.stringify(db));
    saveQ = saveQ.then(() => idbPut('kv', 'db', snap)).catch(() => {
      try { localStorage.setItem(KEY, JSON.stringify(snap)); } catch (e) { toast('تعذّر حفظ البيانات!'); }
    });
  } else {
    try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) { toast('تعذّر حفظ البيانات — المساحة ممتلئة'); }
  }
}
function save() { saveLocal(); if (SYNC.on) schedSync(); }

/* ================= البيانات ================= */
const BANKS = [
  ['البنك الأهلي المصري', 'National Bank of Egypt NBE'], ['بنك مصر', 'Banque Misr'],
  ['البنك التجاري الدولي', 'CIB Commercial International Bank'], ['بنك QNB الأهلي', 'QNB Alahli'],
  ['بنك القاهرة', 'Banque du Caire'], ['بنك الإسكندرية', 'Bank of Alexandria'], ['HSBC مصر', 'HSBC Egypt'],
  ['بنك فيصل الإسلامي', 'Faisal Islamic Bank'], ['بنك أبوظبي الأول', 'First Abu Dhabi Bank FAB'],
  ['بنك الإمارات دبي الوطني', 'Emirates NBD'], ['بنك التعمير والإسكان', 'Housing and Development Bank HDB'],
  ['البنك العربي الأفريقي', 'Arab African International Bank AAIB'], ['بنك قناة السويس', 'Suez Canal Bank'],
  ['بنك المصرف المتحد', 'United Bank'], ['بنك الاستثمار العربي', 'Arab Investment Bank'],
  ['البنك المصري الخليجي', 'Egyptian Gulf Bank EGB'], ['بنك نكست', 'Nxt Bank'],
  ['بنك التنمية الصناعية', 'Industrial Development Bank'], ['البنك الزراعي المصري', 'Agricultural Bank of Egypt'],
  ['بنك مصر إيران للتنمية', 'Misr Iran Development Bank'],
];
const WALLETS = [
  ['فودافون كاش', 'Vodafone Cash', 'wallet'], ['إنستاباي', 'InstaPay', 'wallet'], ['أورنج كاش', 'Orange Cash', 'wallet'],
  ['اتصالات كاش', 'Etisalat Cash', 'wallet'], ['وي باي', 'WE Pay', 'wallet'], ['فوري', 'Fawry', 'wallet'], ['نقدي / خزنة', 'Cash', 'cash'],
];
const instIcon = (i) => (i.type === 'wallet' ? '📱' : i.type === 'cash' ? '💵' : '🏦');
const CATALOG = [...BANKS.map(([ar, en]) => ({ ar, en, type: 'bank' })), ...WALLETS.map(([ar, en, type]) => ({ ar, en, type }))];
/* رقم فريد عالميًا: مينفعش يتكرر بين جهازين */
const UID = (() => { let last = 0; return () => { let x = Date.now() * 1000 + Math.floor(Math.random() * 1000); if (x <= last) x = last + 1; last = x; return x; }; })();
function seed() {
  const d = { ver: 2, inst: [], owners: [], parties: [], accounts: [], trash: [], tx: [], next: 1 };
  CATALOG.forEach((c, i) => d.inst.push({ id: i + 1, type: c.type, ar: c.ar, en: c.en, custom: false }));
  return d;
}
function rekeyInst(d, from, to) {

const canCrypto = () => !!(window.crypto && crypto.subtle);
async function pbkdf(pw, salt) {
  const k = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);

  const key = await pbkdf(pw, salt);
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, new TextEncoder().encode(text)));
  return { app: 'recon_web', v: 2, enc: 1, salt: b64(salt), iv: b64(iv), ct: b64(ct) };
}
async function decryptText(o, pw) {
  const key = await pbkdf(pw, unb64(o.salt));

  return new TextDecoder().decode(pt);
}

function filterTx(f) {
  const q = norm(f.q);
  return db.tx.filter((t) => {
    if (f.from && t.date < f.from) return false;
    if (f.to && t.date > f.to) return false;
    if (f.inst && t.inst !== Number(f.inst)) return false;
    if (f.owner && t.owner !== Number(f.owner)) return false;
    if (f.dir && t.dir !== f.dir) return false;
    if (f.rec === 'yes' && !t.rec) return false;
    if (f.rec === 'no' && t.rec) return false;
    if (q) {
      const i = instById(t.inst), o = ownerById(t.owner), p = t.party ? partyById(t.party) : null;
      const hay = norm([o && o.name, i && i.ar, i && i.en, p && p.name, t.ref, t.note].join(' '));

}

  return A.map((a) => {

    if (ST.from) all.forEach((t) => { if (t.date < ST.from) opening += signed(t); });

    const rows = all.filter((t) => (!ST.from || t.date >= ST.from) && (!ST.to || t.date <= ST.to)).map((t) => { bal += signed(t); return { ...t, bal }; });
    const tin = rows.filter((r) => r.dir === 'in').reduce((s, r) => s + r.amount, 0);

function findDup(amount) {

    (t.owner === F.owner && t.dir === F.dir && Math.abs(t.amount - amount) < 0.005 && t.date === F.date && (!ref || !t.ref || norm(t.ref) === ref)) ||
    (ref && t.ref && norm(t.ref) === ref && Math.abs(t.amount - amount) < 0.005)));
}
async function saveTx(more) {

  const fee = F.fee.trim() ? num(F.fee) : 0;

    t = db.tx.find((x) => x.id === F.id);

  } else {

  else { closeSheet(); toast('تم الحفظ ✓'); }

}
function compressImg(file, max = 1280, q = 0.72) {
  return new Promise((res, rej) => {
    const img = new Image(), u = URL.createObjectURL(file);
    img.onload = () => {
      let w = img.naturalWidth, h = img.naturalHeight; const s = Math.min(1, max / Math.max(w, h)); w = Math.round(w * s); h = Math.round(h * s);
      const c = document.createElement('canvas'); c.width = w; c.height = h; c.getContext('2d').drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(u); c.toBlob((b) => (b ? res(b) : rej(new Error('img'))), 'image/jpeg', q);
    };
    img.onerror = () => { URL.revokeObjectURL(u); rej(new Error('img')); };
    img.src = u;
  });
}

async function makePdf() {
  const gs = stGroups().filter((g) => g.rows.length || g.opening); if (!gs.length) { toast('مفيش عمليات للتصدير'); return null; }
  const PER = 24, pages = [];
  gs.forEach((g) => { const n = Math.max(1, Math.ceil(g.rows.length / PER)); for (let k = 0; k < n; k++) pages.push({ g, rows: g.rows.slice(k * PER, (k + 1) * PER), first: k === 0, last: k === n - 1 }); });
  if (pages.length > 80) { toast('الكشف كبير — حدّد فترة أقصر'); return null; }
  toast('جاري تجهيز PDF...');
  const out = [];
  for (let k = 0; k < pages.length; k++) {
    const c = await htmlToCanvas(pageHtml(pages[k], k + 1, pages.length), 794, 1123, 2);
    const blob = await new Promise((r) => c.toBlob(r, 'image/jpeg', 0.85));
    if (!blob) throw new Error('canvas');
    out.push({ jpg: new Uint8Array(await blob.arrayBuffer()), w: c.width, h: c.height });
  }
  return buildPdf(out);
}

async function buildBackup(withFiles, pw) {
  const payload = { app: 'recon_web', v: 2, at: new Date().toISOString(), data: db };
  if (withFiles && IDBS.db) {
    const files = {}; const keys = await idbKeys('files');
    for (const k of keys) { const b = await idbGet('files', k); if (b) files[k] = await blobToDataUrl(b); }
    if (Object.keys(files).length) payload.files = files;
  }
  let text = JSON.stringify(payload);
  if (pw) text = JSON.stringify(await encryptText(text, pw));
  return new Blob([text], { type: 'application/json' });
}
async function doBackup(share) {
  const pw = ($('#bk-pw') || {}).value || '', wf = $('#bk-files') ? $('#bk-files').checked : false;
  if (pw && !canCrypto()) return toast('التشفير مش متاح هنا — افتح التطبيق من رابط https');
  let blob;
  try { blob = await buildBackup(wf, pw); } catch (e) { return toast('تعذّر إنشاء النسخة'); }
  const name = 'recon_backup_' + today() + (pw ? '_enc' : '') + '.json';
  localStorage.setItem(LASTBK, String(Date.now()));
  if (share && navigator.canShare) {
    const file = new File([blob], name, { type: 'application/json' });
    if (navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: 'نسخة احتياطية — مطابقة الحسابات' }); closeSheet(); render(); return; }
      catch (e) { if (e && e.name === 'AbortError') return; }
    }
  }
  download(blob, name); closeSheet(); render(); toast('اتحفظ ملف النسخة في التنزيلات');
}
function restore() {
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.json,application/json';
  inp.onchange = async () => {
    const f = inp.files[0]; if (!f) return;
    let j; try { j = JSON.parse(await f.text()); } catch (e) { return toast('الملف ده مش نسخة احتياطية من التطبيق'); }
    if (!j || j.app !== 'recon_web') return toast('الملف ده مش نسخة احتياطية من التطبيق');
    if (j.enc) {
      if (!canCrypto()) return toast('النسخة مشفّرة — افتح التطبيق من رابط https عشان تفكها');
      askText('النسخة مشفّرة', { label: 'كلمة السر', type: 'password', ok: 'فك التشفير' }, async (pw) => {
        try { applyRestoreConfirm(JSON.parse(await decryptText(j, pw))); } catch (e) { toast('كلمة السر غلط'); }
      });
    } else applyRestoreConfirm(j);
  };
  inp.click();
}

      const ck = e.c + '|' + e.k, u = Number(e.u) || 0, cur = st.get(ck);
      if (!cur || u > cur.u || (u === cur.u && String(b.d) > String(cur.d))) st.set(ck, { c: e.c, k: String(e.k), u, r: e.r || null, d: b.d });

  st.forEach((v) => { if (v.r) records[v.c].set(v.k, { ...v.r, u: v.u }); else tomb[v.c + '|' + v.k] = v.u; });
  return { records, tomb, lastKey: keys[keys.length - 1] || '' };
}

/* ---------- اكتشاف التغييرات المحلية ---------- */
function syncDetect() {
  const now = Date.now(), local = {};
  for (const c in COLS) {
    local[c] = new Set();
    for (const r of COLS[c].arr()) {
      const ck = c + '|' + COLS[c].key(r); local[c].add(ck);
      const h = recHash(r);
      const tb = SYNC.tomb[ck] || 0;   // لو السجل رجع بعد ما اتحذف (تراجع/استرجاع) لازم يبقى أحدث من علامة الحذف
      if ((SYNC.shadow[ck] !== h && SYNC.stamp[ck] !== h) || (tb && (r.u || 0) <= tb)) { r.u = Math.max(now, tb + 1); SYNC.stamp[ck] = h; }
    }
  }
  for (const ck in SYNC.shadow) {
    const c = ck.slice(0, ck.indexOf('|'));
    if (COLS[c] && !local[c].has(ck) && !SYNC.delStamp[ck]) SYNC.delStamp[ck] = now;
  }
}

/* ---------- سحب تغييرات الأجهزة التانية ---------- */
function applyEntries(list) {
  const M = {}; for (const c in COLS) M[c] = new Map(COLS[c].arr().map((r) => [COLS[c].key(r), r]));
  const touched = new Set();
  for (const e of list) {
    const c = e.c, k = String(e.k), ck = c + '|' + k, u = Number(e.u) || 0, loc = M[c].get(k), tomb = SYNC.tomb[ck] || 0;
    if (e.r === undefined || e.r === null) {          // حذف من جهاز تاني
      if (u > tomb) SYNC.tomb[ck] = u;
      if (loc && (loc.u || 0) <= u) { M[c].delete(k); delete SYNC.shadow[ck]; delete SYNC.delStamp[ck]; touched.add(c); }
    } else {                                          // إضافة / تعديل من جهاز تاني
      if (tomb >= u) continue;
      const lu = loc ? loc.u || 0 : -1;
      if (loc && !(u > lu || (u === lu && String(e._d) > String(SYNC.dev) && recHash(e.r) !== recHash(loc)))) continue;
      const rec = { ...e.r, u }; M[c].set(k, rec); SYNC.shadow[ck] = recHash(rec); SYNC.stamp[ck] = SYNC.shadow[ck]; delete SYNC.delStamp[ck]; touched.add(c);
    }
  }
  touched.forEach((c) => {
    if (c === 'inst') db.inst = [...db.inst.filter((i) => !i.custom), ...M.inst.values()];
    else db[c] = [...M[c].values()];
  });
  return touched.size > 0;
}
async function syncPull() {
  const q = SYNC.lastKey ? 'orderBy=' + enc('"$key"') + '&startAt=' + enc(JSON.stringify(SYNC.lastKey + '!')) : '';
  const log = await fbReq('GET', '/recon/log', { q });
  if (!log) return false;
  const keys = Object.keys(log).sort(), list = [];
  for (const bk of keys) { const b = log[bk] || {}; if (b.d !== SYNC.dev) batchEntries(b).forEach((e) => list.push({ ...e, _d: b.d })); }
  SYNC.lastKey = keys[keys.length - 1] || SYNC.lastKey;
  return applyEntries(list);
}

/* ---------- رفع التغييرات المحلية ---------- */
async function syncPush() {
  const ents = [], adds = [], dels = [];
  for (const c in COLS) for (const r of COLS[c].arr()) {
    const k = COLS[c].key(r), ck = c + '|' + k, h = recHash(r);
    if (SYNC.shadow[ck] !== h) { if (!r.u) r.u = Date.now(); ents.push({ c, k, u: r.u, r }); adds.push([ck, h]); }
  }
  const have = {}; for (const c in COLS) have[c] = new Set(COLS[c].arr().map((r) => c + '|' + COLS[c].key(r)));
  for (const ck in SYNC.shadow) {
    const c = ck.slice(0, ck.indexOf('|'));
    if (COLS[c] && !have[c].has(ck)) { const u = SYNC.delStamp[ck] || Date.now(); ents.push({ c, k: ck.slice(c.length + 1), u }); dels.push([ck, u]); }
  }
  const addMap = new Map(adds);
  for (let i = 0; i < ents.length; i += 200) {
    const chunk = ents.slice(i, i + 200);
    await fbReq('POST', '/recon/log', { body: { d: SYNC.dev, t: Date.now(), e: chunk } });
    chunk.forEach((e) => {
      const ck = e.c + '|' + e.k;
      if (e.r) SYNC.shadow[ck] = addMap.get(ck);
      else { delete SYNC.shadow[ck]; SYNC.tomb[ck] = e.u; delete SYNC.delStamp[ck]; }
    });
  }
  return ents.length;
}

/* الدمج: أي حاجة على الجهاز بتاخد أرقام جديدة عشان مفيش تعارض، والأسماء المتشابهة بتتوحّد */
async function joinMerge(cloud) {
  const CR = cloud.records;
  const names = (m, f) => { const o = new Map(); m.forEach((r) => o.set(norm(f(r)), r.id)); return o; };
  const cO = names(CR.owners, (r) => r.name), cP = names(CR.parties, (r) => r.name), cI = names(CR.inst, (r) => r.ar);
  const oMap = new Map(), pMap = new Map(), iMap = new Map(), newO = [], newP = [], newI = [];
  db.owners.forEach((o) => { const to = cO.get(norm(o.name)); if (to != null) oMap.set(o.id, to); else { const n = UID(); oMap.set(o.id, n); const { u, ...rest } = o; newO.push({ ...rest, id: n }); } });
  db.parties.forEach((p) => { const to = cP.get(norm(p.name)); if (to != null) pMap.set(p.id, to); else { const n = UID(); pMap.set(p.id, n); const { u, ...rest } = p; newP.push({ ...rest, id: n }); } });
  db.inst.filter((i) => i.custom).forEach((i) => { const to = cI.get(norm(i.ar)); if (to != null) iMap.set(i.id, to); else { const n = UID(); iMap.set(i.id, n); const { u, ...rest } = i; newI.push({ ...rest, id: n }); } });
  const mO = (x) => (oMap.has(x) ? oMap.get(x) : x), mI = (x) => (iMap.has(x) ? iMap.get(x) : x), mP = (x) => (x ? (pMap.has(x) ? pMap.get(x) : x) : 0);
  const seen = new Set(CR.accounts.keys()), accs = [];
  db.accounts.forEach((a) => { const o = mO(a.owner), i = mI(a.inst), k = o + ':' + i; if (seen.has(k)) return; seen.add(k); accs.push({ id: UID(), owner: o, inst: i, opening: a.opening || 0 }); });
  const remap = async (t) => {
    const { u, ...rest } = t; const n = { ...rest, id: UID(), owner: mO(t.owner), inst: mI(t.inst), party: mP(t.party) };
    if (t.att) { const b = await fileLocalGet(t.id); if (b) { await idbPut('files', n.id, b); await idbDel('files', t.id); if (!SYNC.files.includes(n.id)) SYNC.files.push(n.id); } else n.att = false; }
    return n;
  };
  const tx = [], trash = []; for (const t of db.tx) tx.push(await remap(t)); for (const t of db.trash) trash.push(await remap(t));
  db.owners = [...CR.owners.values(), ...newO]; db.parties = [...CR.parties.values(), ...newP];
  db.inst = [...db.inst.filter((i) => !i.custom), ...CR.inst.values(), ...newI];
  db.accounts = [...CR.accounts.values(), ...accs]; db.tx = [...CR.tx.values(), ...tx]; db.trash = [...CR.trash.values(), ...trash];
  SYNC.shadow = {}; SYNC.stamp = {}; SYNC.delStamp = {}; SYNC.tomb = { ...cloud.tomb }; SYNC.lastKey = cloud.lastKey;
  for (const c in CR) CR[c].forEach((r, k) => { SYNC.shadow[c + '|' + k] = recHash(r); });
  saveLocal();
}

        ${o.accs.map((a) => { const i = instById(a.inst); return `<div class="arow" data-act="stAcc" data-o="${a.owner}" data-i="${a.inst}"><span>${instIcon(i)}</span><div class="grow">${esc(i.ar)}</div><b class="${a.bal >= 0 ? 'in' : 'out'}">${fmt(a.bal)}</b></div>`; }).join('')}</div>`).join(''))
      : '<div class="card mut" style="text-align:center">مفيش أرصدة مطابقة</div>'}`;
}
function balText() {
  const d = balData(), bank = BF.inst ? instById(Number(BF.inst)) : null;
  const L = ['ملخص الأرصدة' + (bank ? ' — ' + bank.ar : '') + ' (' + fmtDate(BF.to || today()) + ')', ''];
  d.list.forEach((o) => {
    L.push(ownerById(o.owner).name + ': ' + fmt(o.total));
    if (!bank && o.accs.length > 1) o.accs.forEach((a) => L.push('   • ' + instById(a.inst).ar + ': ' + fmt(a.bal)));
  });
  L.push('', 'الإجمالي: ' + fmt(d.total) + ' ج.م');
  return L.join('\n');
}
async function balShare() {
  const t = balText();
  if (navigator.share) { try { await navigator.share({ text: t }); return; } catch (e) { if (e && e.name === 'AbortError') return; } }
  copyText(t);
}
function balExport() {
  const d = balData(); if (!d.list.length) return toast('مفيش أرصدة للتصدير');
  const insts = [...new Set(d.list.flatMap((o) => o.accs.map((a) => a.inst)))].map(instById).sort((a, b) => a.ar.localeCompare(b.ar, 'ar'));
  const colTot = insts.map((i) => r2(d.list.reduce((s, o) => s + ((o.accs.find((a) => a.inst === i.id) || {}).bal || 0), 0)));
  const rows = [[HC('صاحب الحساب'), ...insts.map((i) => HC(i.ar)), HC('الإجمالي')],
    ...d.list.map((o) => [ownerById(o.owner).name, ...insts.map((i) => { const a = o.accs.find((x) => x.inst === i.id); return a ? r2(a.bal) : ''; }), BN(r2(o.total))]),
    [BT('الإجمالي'), ...colTot.map(BN), BN(r2(d.total))]];
  download(xlsxBlob([{ name: 'ملخص الأرصدة', widths: [24, ...insts.map(() => 16), 16], rows }]), 'balances_' + today() + '.xlsx');
}
/* ================= الأحداث ================= */
let backTo = 'reports';
function openStatement(title, inst, owner) {
  if (view !== 'statement' && view !== 'monthly') backTo = view;
  ST = { title, inst, owner, from: '', to: '', all: {} }; view = 'statement'; closeSheet(); render(); window.scrollTo(0, 0);
}
const accTitle = (o, i) => ownerById(o).name + ' — ' + instById(i).ar;

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (!el) { if (e.target.classList && e.target.classList.contains('ov')) closeSheet(); return; }

  switch (act) {

    case 'homeFilter': openHomeFilter(); break;
    case 'hfApply': closeSheet(); render(); break;
    case 'hfReset': HF = { q: HF.q, owner: '', inst: '', pend: false }; closeSheet(); render(); break;
    case 'hfClear': HF[el.dataset.k] = el.dataset.k === 'pend' ? false : ''; $('#homebody').innerHTML = homeBody(); render(); break;
    case 'homeAllTx': FL = { from: '', to: '', inst: HF.inst, owner: HF.owner, dir: '', rec: HF.pend ? 'no' : '', q: HF.q, lim: 60 }; view = 'txs'; render(); window.scrollTo(0, 0); break;
    /* فلترة الأصحاب */
    case 'ownersFilter': openOwnersFilter(); break;
    case 'ofApply': closeSheet(); render(); break;
    case 'ofReset': OF = { q: OF.q, inst: '', pend: false }; closeSheet(); render(); break;
    case 'ofClear': OF[el.dataset.k] = el.dataset.k === 'pend' ? false : ''; render(); break;
    /* مزامنة الأجهزة */
    case 'syncOpen': syncSheet(); break;
    /* استيراد من Excel + ملخص الأرصدة */

    case 'imxTemplate': imxTemplate(); break;
    case 'imxPickOwner': pickOwner((oid) => { IMX.fixOwner = ownerById(oid).name; imxMapStep(); }); break;
    case 'imxPickInst': pickInst((iid) => { IMX.fixInst = instById(iid).ar; imxMapStep(); }); break;
    case 'imxPreview': imxPreview(); break;
    case 'imxBackMap': imxMapStep(); break;
    case 'imxApply': imxApply(); break;
    case 'imxUndoAsk': askConfirm('هتتمسح ' + (db.lastImport ? db.lastImport.ids.length : 0) + ' عملية اتضافت في آخر استيراد (وكمان الأصحاب والبنوك الجديدة لو مش مستخدمة). متأكد؟', 'تراجع', imxUndo, true); break;
    case 'balOpen': view = 'owners'; OT = 'bal'; selMode = false; render(); window.scrollTo(0, 0); break;
    case 'balExport': balExport(); break;
    case 'balShare': balShare(); break;
    case 'balCopy': copyText(balText()); break;
    case 'syncNow': toast('جاري المزامنة...'); syncCycle().then(() => toast(SYNC.err ? 'مشكلة: ' + SYNC.err : 'اتزامنت ✓')); break;
    case 'syncConnect': syncConnect(); break;
    case 'syncOff': askConfirm('هيتقطع الربط على الجهاز ده بس. بياناتك على الجهاز والسحابة هتفضل زي ما هي.', 'اقطع الربط', syncDisconnect, true); break;
    case 'syncCopyRules': copyText(rulesText(SYNC.form.email), 'syncOpen'); break;
    case 'syncCopyStrong': copyText(strongRules(SYNC.cfg.uid), 'syncOpen'); break;
    case 'syncCopyCode': copyText(setupCode(), 'syncOpen'); break;
    case 'syncPasteCode': syncPasteCode(); break;
    /* تنقل */
    case 'go': if (v === 'monthly') backTo = 'reports'; view = v; selMode = false; SEL.clear(); closeSheet(); render(); window.scrollTo(0, 0); break;
    case 'back': view = backTo; render(); window.scrollTo(0, 0); break;
    case 'toastAct': { const f = toastFn; toastFn = null; $('#toast').style.display = 'none'; if (f) f(); break; }
    case 'reloadApp': location.reload(); break;
    /* حوارات */
    case 'dlgOk': { const d = DLG; if (!d) break; DLG = null; const val = d.kind === 'text' ? ($('#dlg-in') || {}).value : undefined; closeSheet(); d.cb(val); break; }
    case 'dlgBack': { const d = DLG; DLG = null; closeSheet(); if (d && typeof d.back === 'function') d.back(); break; }
    case 'closeSheet': closeSheet(); break;
    /* عملية جديدة / فورم */
    case 'newTx': newForm(); if (view === 'statement') { if (ST.inst) F.inst = ST.inst; if (ST.owner) F.owner = ST.owner; } openTxForm(true); break;
    case 'setDir': F.dir = v; openTxForm(false); break;
    case 'pickInstForm': pickInst((i) => { F.inst = i; openTxForm(false); }); break;
    case 'pickOwnerForm': pickOwner((i) => { F.owner = i; openTxForm(false); }); break;
    case 'pickPartyForm': pickParty((i) => { F.party = i; openTxForm(false); }); break;
    case 'pickIt': { const cb = pickCb; if (cb) cb(id); break; }
    case 'pickNew': {
      const kind = pickKind, cb = pickCb;
      const T = { inst: 'اسم البنك الجديد', owner: 'اسم صاحب الحساب', party: 'الاسم' }[kind];
      askText(T, { value: v || '', ok: 'إضافة' }, (name) => {
        const n = kind === 'inst' ? addBank(name) : kind === 'owner' ? addOwner(name) : addParty(name);
        if (n && cb) cb(n.id);
      });
      break;
    }
    case 'pickAtt': { const inp = $('#attInput'); if (inp) inp.click(); break; }
    case 'rmAtt': F.attBlob = null; F.attRemove = true; openTxForm(false); break;
    case 'viewAtt': fileGet(id).then((b) => { if (b) sheet(`<div class="sh-h"><b>صورة الإيصال</b><button class="x" data-act="closeSheet">✕</button></div><img src="${objUrl(b)}" style="width:100%;border-radius:12px">`); }); break;
    case 'saveTx': saveTx(false); break;
    case 'saveTxMore': saveTx(true); break;
    /* عمليات */
    case 'txDetails': txDetails(id); break;
    case 'toggleRec': { e.stopPropagation(); const t = db.tx.find((x) => x.id === id); t.rec = !t.rec; save(); render(); break; }
    case 'toggleRecClose': { const t = db.tx.find((x) => x.id === id); t.rec = !t.rec; save(); closeSheet(); render(); break; }
    case 'delTxQuick': e.stopPropagation(); askConfirm('حذف العملية دي؟ تقدر ترجّعها من "المحذوفات".', 'حذف', () => deleteTx([id]), true); break;
    case 'delTx': closeSheet(); deleteTx([id]); break;
    case 'editTx': { const t = db.tx.find((x) => x.id === id); newForm(t); openTxForm(false); break; }
    /* تحديد متعدد */
    case 'selMode': selMode = !selMode; SEL.clear(); render(); break;
    case 'selTx': if (SEL.has(id)) SEL.delete(id); else SEL.add(id); render(); break;
    case 'selAll': { const ids = filterTx(FL).map((t) => t.id); if (SEL.size === ids.length) SEL.clear(); else ids.forEach((x) => SEL.add(x)); render(); break; }
    case 'bulkRec': { if (!SEL.size) { toast('حدّد عمليات الأول'); break; } const on = v === '1'; db.tx.forEach((t) => { if (SEL.has(t.id)) t.rec = on; }); save(); toast((on ? 'اتأشّرت مطابقة: ' : 'اتلغت المطابقة: ') + SEL.size); SEL.clear(); selMode = false; render(); break; }
    case 'bulkDel': { if (!SEL.size) { toast('حدّد عمليات الأول'); break; } const ids = [...SEL]; askConfirm('حذف ' + ids.length + ' عملية؟ تقدر ترجّعهم من "المحذوفات".', 'حذف', () => { selMode = false; deleteTx(ids); }, true); break; }
    /* فلاتر */
    case 'setRec': FL.rec = v; FL.lim = 60; render(); break;
    case 'moreTx': FL.lim += 60; $('#txlist').innerHTML = txListHtml(); break;
    case 'openFilter': openFilter(); break;
    case 'applyFilter': FL.lim = 60; closeSheet(); render(); break;
    case 'clearFilter': FL = { from: '', to: '', inst: '', owner: '', dir: '', rec: FL.rec, q: FL.q, lim: 60 }; closeSheet(); render(); break;
    /* كشوف */
    case 'stInst': openStatement(instById(id).ar, id, 0); break;
    case 'stOwner': openStatement(ownerById(id).name, 0, id); break;
    case 'stAcc': openStatement(accTitle(o, ii), ii, o); break;
    case 'repInst': pickInst((i) => openStatement(instById(i).ar, i, 0)); break;
    case 'repOwner':
      if (!db.owners.length) { toast('لسه مفيش أصحاب حسابات'); break; }
      pickCustom(db.owners.map((x) => ({ id: x.id, label: x.name, sub: x.phone, icon: '👤' })), 'اختار الشخص', (i) => openStatement(ownerById(i).name, 0, i)); break;
    case 'repAll': openStatement('كل الحسابات', 0, 0); break;
    case 'showAll': ST.all[el.dataset.k] = true; render(); break;
    case 'exportXls': exportXls(); break;
    case 'exportPdf': exportPdf(false); break;
    case 'sharePdf': exportPdf(true); break;
    case 'shareReady': if (readyFile) navigator.share({ files: [readyFile], title: ST.title }).then(closeSheet).catch((er) => { if (!er || er.name !== 'AbortError') { download(readyFile, readyFile.name); closeSheet(); } }); break;
    case 'saveReady': if (readyFile) { download(readyFile, readyFile.name); closeSheet(); toast('اتحفظ الملف في التنزيلات'); } break;
    /* حسابات */
    case 'editOpening': {
      const cur = (db.accounts.find((a) => a.owner === o && a.inst === ii) || {}).opening || 0;
      askText('الرصيد الافتتاحي', { hint: accTitle(o, ii) + ' — الرصيد قبل أول عملية مسجّلة هنا', value: String(cur), inputmode: 'decimal', ok: 'حفظ' }, (val) => {
        const n = num(val); setOpening(o, ii, isFinite(n) ? n : 0); render(); toast('تم الحفظ ✓');
      }); break;
    }
    case 'addAcc': {
      const owner = ST.owner;
      pickInst((inst) => askText('الرصيد الافتتاحي (اختياري)', { hint: accTitle(owner, inst), value: '0', inputmode: 'decimal', ok: 'إضافة الحساب' }, (val) => {
        const n = num(val); setOpening(owner, inst, isFinite(n) ? n : 0); render(); toast('اتضاف الحساب ✓');
      })); break;
    }
    /* أصحاب / أطراف / بنوك */
    case 'ot': OT = v; render(); break;
    case 'editOwner': e.stopPropagation(); manageSheet('owner', id); break;
    case 'editParty': manageSheet('party', id); break;
    case 'editBank': e.stopPropagation(); manageSheet('inst', id); break;
    case 'addOwnerBtn': askText('اسم صاحب الحساب', { ok: 'إضافة' }, (n) => { if (addOwner(n)) { render(); toast('تمت الإضافة'); } }); break;
    case 'addPartyBtn': askText('اسم الطرف', { ok: 'إضافة' }, (n) => { if (addParty(n)) { render(); toast('تمت الإضافة'); } }); break;
    case 'addBank': askText('اسم البنك الجديد', { ok: 'إضافة' }, (n) => { if (addBank(n)) { bankQ = ''; render(); toast('تمت الإضافة'); } }); break;
    case 'mSave': mSave(el.dataset.k, id); break;
    case 'mDel': mDel(el.dataset.k, id); break;
    case 'mMerge': mMerge(el.dataset.k, id); break;
    /* استيراد الكشف */
    case 'impStart': impStart(); break;
    case 'impStartAcc': impStart(ST.owner, ST.inst); break;
    case 'impAcc': impStart(o, ii); break;
    case 'impRun': impRun(); break;
    case 'impTogAdd': { const k = Number(el.dataset.k); if (IMP.add.has(k)) IMP.add.delete(k); else IMP.add.add(k); const y = $('.sh').scrollTop; impResultStep(); $('.sh').scrollTop = y; break; }
    case 'impApply': impApply(); break;
    case 'impExport': impExport(); break;
    /* نسخ احتياطي */
    case 'backupSheet': backupSheet(); break;
    case 'bkShare': doBackup(true); break;
    case 'bkSave': doBackup(false); break;
    case 'bkLater': localStorage.setItem(SNOOZE, String(Date.now() + 864e5)); render(); break;
    case 'restore': restore(); break;
    case 'trash': trashSheet(); break;
    case 'trashRestore': restoreFromTrash([id]); render(); trashSheet(); toast('رجعت ✓'); break;
    case 'trashEmpty': askConfirm('هتتمسح كل العمليات المحذوفة نهائيًا. متأكد؟', 'تفريغ', () => { db.trash.forEach((t) => { if (t.att) fileDel(t.id); }); db.trash = []; save(); render(); toast('اتفرّغت'); }, true); break;
    /* تطبيق */
    case 'cycleTheme': { const m = localStorage.getItem(THEME_KEY) || 'auto'; localStorage.setItem(THEME_KEY, { auto: 'light', light: 'dark', dark: 'auto' }[m]); applyTheme(); render(); break; }

      if ((val || '').trim() !== 'مسح') return toast('ما اتمسحش — الكلمة مش مطابقة');
      localStorage.removeItem(KEY); if (IDBS.db) { try { await idbClear('files'); } catch (er) {} }
      db = seed(); save(); view = 'home'; render(); toast('اتمسحت');
    }); break;
  }
});
document.addEventListener('input', (e) => {
  const t = e.target;
  if (t.dataset.f) F[t.dataset.f] = t.value;
  else if (t.dataset.fl) FL[t.dataset.fl] = t.value;
  else if (t.dataset.bf) { BF[t.dataset.bf] = t.type === 'checkbox' ? t.checked : t.value; render(); }
  else if (t.dataset.sc) { if (t.dataset.sc !== 'code') { SYNC.form[t.dataset.sc] = t.value; if (t.dataset.sc === 'email' && $('#rulesTxt')) $('#rulesTxt').value = rulesText(t.value); } }
  else if (t.dataset.hf) { HF[t.dataset.hf] = t.type === 'checkbox' ? t.checked : t.value; }
  else if (t.dataset.of) { OF[t.dataset.of] = t.type === 'checkbox' ? t.checked : t.value; }
  else if (t.id === 'ownerq') { OF.q = t.value; $('#ownersbody').innerHTML = ownersBody(); }
  else if (t.id === 'homeq') { HF.q = t.value; $('#homebody').innerHTML = homeBody(); }
  else if (t.dataset.st) { ST[t.dataset.st] = t.value; render(); }
  else if (t.dataset.ms) { MS[t.dataset.ms] = t.value; render(); }
  else if (t.id === 'txq') { FL.q = t.value; FL.lim = 60; $('#txlist').innerHTML = txListHtml(); }
  else if (t.id === 'bankq') { bankQ = t.value; $('#banklist').innerHTML = bankListHtml(); }
  else if (t.id === 'pickq') renderPick(t.value);
});
document.addEventListener('change', async (e) => {
  const t = e.target;
  if (t.id === 'attInput' && t.files[0]) {
    try { F.attBlob = await compressImg(t.files[0]); F.attRemove = false; openTxForm(false); } catch (er) { toast('تعذّر قراءة الصورة'); }
  } else if (t.id === 'imxfile' && t.files[0]) {
    imxLoad(t.files[0]);
  } else if (t.dataset.imx) {
    const k = t.dataset.imx;
    if (k === 'si') imxSetSheet(Number(t.value)); else if (k === 'mode') IMX.mode = t.value; else if (k === 'inv') IMX.inv = t.checked;
    else if (k === 'skipDup') IMX.skipDup = t.checked; else if (k === 'rec') IMX.rec = t.checked; else IMX.map[k] = Number(t.value);
    const y = $('.sh') ? $('.sh').scrollTop : 0; if (IMX.step === 'prev') imxPreview(); else imxMapStep(); if ($('.sh')) $('.sh').scrollTop = y;
  } else if (t.id === 'impfile' && t.files[0]) {
    impLoadFile(t.files[0]);
  } else if (t.dataset.imp) {
    const k = t.dataset.imp;
    if (k === 'mode') IMP.mode = t.value; else if (k === 'inv') IMP.inv = t.checked; else IMP.map[k] = Number(t.value);
    const y = $('.sh') ? $('.sh').scrollTop : 0; impMapStep(); if ($('.sh')) $('.sh').scrollTop = y;
  }
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && e.target && e.target.id === 'dlg-in') { e.preventDefault(); const b = $('[data-act=dlgOk]'); if (b) b.click(); }
});
window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); installEvt = e; if (view === 'reports') render(); });
if (window.matchMedia) { try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme); } catch (e) {} }

/* ===== تحديث التطبيق ===== */
function showUpdate() { const u = $('#upd'); if (u) u.style.display = 'flex'; }
async function checkUpdate() {
  try {
    const mine = (document.querySelector('meta[name=build]') || {}).content;
    const r = await fetch(location.pathname + '?chk=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) return;
    const m = /name="build" content="([^"]+)"/.exec(await r.text());
    if (m && mine && m[1] !== mine) showUpdate();
  } catch (e) {}
}
if ('serviceWorker' in navigator) {
  const hadCtl = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('sw.js').catch(() => {});
  navigator.serviceWorker.addEventListener('message', (e) => { if (e.data && e.data.type === 'update') showUpdate(); });
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadCtl) showUpdate(); });
}

/* ===== تشغيل ===== */
(async () => {
  applyTheme();
  try { await loadDb(); } catch (e) { db = seed(); }
  try { await syncLoad(); } catch (e) {}
  try { localStorage.removeItem('recon_pin_v1'); } catch (e) {}
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
  render();
  setTimeout(checkUpdate, 2500);
})();
